function drawCan(x,y,size,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.shadowColor='#9a3b1270';ctx.shadowBlur=5;ctx.shadowOffsetY=3;let w=size*.68,h=size*1.24;let g=ctx.createLinearGradient(-w/2,0,w/2,0);g.addColorStop(0,'#db4a12');g.addColorStop(.22,'#ff9a21');g.addColorStop(.58,'#f36513');g.addColorStop(1,'#c94013');ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,size*.15);ctx.fill();ctx.shadowColor='transparent';ctx.shadowOffsetY=0;ctx.fillStyle='#d9d9d9';ctx.beginPath();ctx.ellipse(0,-h/2+1,w*.43,size*.10,0,0,7);ctx.fill();ctx.fillStyle='#888';ctx.beginPath();ctx.ellipse(0,-h/2+1,w*.20,size*.045,0,0,7);ctx.fill();ctx.fillStyle='#ffd84e';ctx.font='1000 '+(size*.34)+'px system-ui';ctx.textAlign='center';ctx.fillText('F',0,size*.08);ctx.fillStyle='#fff';ctx.font='900 '+(size*.105)+'px system-ui';ctx.fillText('FANTA',0,size*.33);ctx.fillStyle='#ffffff66';ctx.fillRect(-w*.35,-h*.25,w*.08,h*.5);ctx.restore()}
function drawCan(x,y,size,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.shadowColor='#9a3b1270';ctx.shadowBlur=5;ctx.shadowOffsetY=3;let w=size*.68,h=size*1.24;let g=ctx.createLinearGradient(-w/2,0,w/2,0);g.addColorStop(0,'#db4a12');g.addColorStop(.22,'#ff9a21');g.addColorStop(.58,'#f36513');g.addColorStop(1,'#c94013');ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,size*.15);ctx.fill();ctx.shadowColor='transparent';ctx.shadowOffsetY=0;ctx.fillStyle='#d9d9d9';ctx.beginPath();ctx.ellipse(0,-h/2+1,w*.43,size*.10,0,0,7);ctx.fill();ctx.fillStyle='#888';ctx.beginPath();ctx.ellipse(0,-h/2+1,w*.20,size*.045,0,0,7);ctx.fill();ctx.fillStyle='#ffd84e';ctx.font='1000 '+(size*.34)+'px system-ui';ctx.textAlign='center';ctx.fillText('F',0,size*.08);ctx.fillStyle='#fff';ctx.font='900 '+(size*.105)+'px system-ui';ctx.fillText('FANTA',0,size*.33);ctx.fillStyle='#ffffff66';ctx.fillRect(-w*.35,-h*.25,w*.08,h*.5);ctx.restore()}
function drawGameCan(x,y,size,rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);let w=size*.68,h=size*1.24;ctx.shadowColor='#8f361b88';ctx.shadowBlur=size*.12;ctx.shadowOffsetY=size*.08;let grad=ctx.createLinearGradient(-w/2,0,w/2,0);grad.addColorStop(0,'#d94b10');grad.addColorStop(.2,'#ff9e18');grad.addColorStop(.53,'#ff7a0d');grad.addColorStop(.82,'#ff9b12');grad.addColorStop(1,'#c83c10');ctx.fillStyle=grad;ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,size*.14);ctx.fill();ctx.shadowColor='transparent';ctx.shadowOffsetY=0;ctx.fillStyle='#d4d7d6';ctx.beginPath();ctx.ellipse(0,-h/2+1,w*.46,size*.09,0,0,7);ctx.ellipse(0,h/2-1,w*.46,size*.09,0,0,7);ctx.fill();ctx.fillStyle='#737a7b';ctx.beginPath();ctx.ellipse(0,-h/2+1,w*.2,size*.035,0,0,7);ctx.ellipse(0,h/2-1,w*.2,size*.035,0,0,7);ctx.fill();ctx.fillStyle='#42a936';ctx.beginPath();ctx.ellipse(size*.07,-size*.23,size*.14,size*.055,-.55,0,7);ctx.ellipse(-size*.015,-size*.22,size*.105,size*.045,.55,0,7);ctx.fill();ctx.font='italic 1000 '+(size*.255)+'px system-ui';ctx.textAlign='center';ctx.lineJoin='round';ctx.lineWidth=size*.085;ctx.strokeStyle='#fff';ctx.strokeText('Fanta',0,size*.12);ctx.fillStyle='#083899';ctx.fillText('Fanta',0,size*.12);ctx.fillStyle='#ffe64b';ctx.beginPath();ctx.arc(size*.06,size*.34,size*.105,0,7);ctx.fill();ctx.strokeStyle='#fff5d2';ctx.lineWidth=Math.max(1,size*.025);ctx.beginPath();ctx.moveTo(size*.06-size*.08,size*.34);ctx.lineTo(size*.06+size*.08,size*.34);ctx.moveTo(size*.06,size*.26);ctx.lineTo(size*.06,size*.42);ctx.stroke();ctx.fillStyle='#ffffff55';ctx.fillRect(-w*.34,-h*.24,w*.065,h*.48);ctx.restore()}
function drawOrange(o){if(o.collected)return;let y=o.y+cam;if(y<-30||y>H+30)return;let g=ctx.createRadialGradient(o.x-o.r*.35,y-o.r*.4,1,o.x,y,o.r*1.2);g.addColorStop(0,'#ffd65a');g.addColorStop(.5,'#ff9b18');g.addColorStop(1,'#e9650c');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(o.x,y-o.r);ctx.bezierCurveTo(o.x+o.r*.8,y-o.r*1.15,o.x+o.r*1.2,y-o.r*.55,o.x+o.r,y);ctx.bezierCurveTo(o.x+o.r*1.12,y+o.r*.72,o.x+o.r*.55,y+o.r,o.x,y+o.r*.88);ctx.bezierCurveTo(o.x-o.r*.65,y+o.r,o.x-o.r*1.1,y+o.r*.56,o.x-o.r,y);ctx.bezierCurveTo(o.x-o.r*1.1,y-o.r*.65,o.x-o.r*.55,y-o.r*1.08,o.x,y-o.r);ctx.fill();ctx.fillStyle='#499c35';ctx.beginPath();ctx.ellipse(o.x+2,y-o.r*.83,4,2,-.5,0,7);ctx.fill();ctx.fillStyle='#7f4e26';ctx.beginPath();ctx.roundRect(o.x-1,y-o.r-2,2,4,1);ctx.fill();ctx.fillStyle='#fff5c2aa';ctx.beginPath();ctx.ellipse(o.x-o.r*.36,y-o.r*.23,o.r*.18,o.r*.29,-.5,0,7);ctx.fill()}
function loop(now){if(!playing)return;let dt=Math.min((now-last)/1000,.032);last=now;player.vx=(keys.right?260:0)-(keys.left?260:0);player.x+=player.vx*dt;if(player.x<-20)player.x=W+20;if(player.x>W+20)player.x=-20;let oldY=player.y;player.vy+=1050*dt;player.y+=player.vy*dt;
if(player.vy>0){for(let p of plats){let py=p.y;if(!p.broken&&oldY+19<=py&&player.y+19>=py&&player.x>p.x-12&&player.x<p.x+p.w+12){player.y=py-19;player.vy=p.type===2?-1550:p.type===1?-720:-630;if(p.type===3){p.broken=true;playSlimeSound();for(let i=0;i<16;i++)particles.push({x:p.x+p.w/2,y:p.y+4,r:rand(3,8),vx:rand(-160,160),vy:rand(-180,10),life:rand(.35,.7),color:['#ff6d0b','#ff9a18','#ffc12b','#e94a13'][i%4],splat:true})}break}}}
if(player.y+cam<H*.40){let d=H*.40-(player.y+cam);cam+=d;score=Math.max(score,Math.floor(cam/10));scoreEl.textContent=score;}
while(nextRocket*10- H < cam+H){let lane=Math.floor(nextRocket/100)%3;plats.push({x:platformX(lane,88),y:H-55-nextRocket*10,w:88,h:10,type:2,color:2,lane});nextRocket+=100}for(let p of plats){let sy=p.y+cam;if(sy>H+25){if(score>=2000&&plats.length>8){p.remove=true}else{p.y-=H+rand(45,90);p.lane=(p.lane+1)%3;p.x=platformX(p.lane,p.w);p.type=Math.random()<.16?1:(Math.random()<.25?3:0);p.color=(p.color+1)%3;p.broken=false}}}plats=plats.filter(p=>!p.remove);
for(let o of oranges){let y=o.y+cam;if(!o.collected&&Math.abs(player.x-o.x)<25&&Math.abs(player.y-y)<25){score+=25;scoreEl.textContent=score;o.collected=true;for(let i=0;i<8;i++)particles.push({x:o.x,y:o.y,r:rand(2,5),vx:rand(-60,60),vy:rand(-100,20),life:.5,color:'#ffc22a'})}}
for(let q of particles){q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.splat)q.vy+=380*dt;q.life-=dt}particles=particles.filter(q=>q.life>0);
drawBackground();oranges.forEach(drawOrange);plats.forEach(drawPlatform);drawPlayer();for(let q of particles){ctx.globalAlpha=Math.max(q.life*2,0);ctx.fillStyle=q.color||'#fff4a0';ctx.beginPath();ctx.arc(q.x,q.y+cam,q.r,0,7);ctx.fill()}ctx.globalAlpha=1;
if(player.y+cam>H+35)end();else requestAnimationFrame(loop)}
})();
